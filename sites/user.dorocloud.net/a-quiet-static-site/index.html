          <h1 class="entry-title">把站点换成静态页之后的三个月</h1>
          <p class="post-meta entry-meta"><time datetime="2026-09-28T21:05:00">2026年9月28日</time></p>
        </header>
        <div class="entry-content">
          <p>没有数据库，没有后台，没有插件更新提醒。三个月里它没有挂过一次，也没有快过一次，因为一开始就已经够快了。</p>
          <p>省掉的是运维里的那些「顺手看一眼」：不用查慢查询，不用等插件兼容，不用担心某次自动更新把布局弄坏。付出的是每次改内容都要重新构建、重新上传，以及没有评论框。</p>
          <p>评论这一项我想了很久。最后的结论是：真正想说话的人会找到邮箱，其余的人本来也只是路过。</p>
          <p>还有一件没预料到的好处：因为改内容变麻烦了，我删掉的东西比写下的多。</p>
        </div>
