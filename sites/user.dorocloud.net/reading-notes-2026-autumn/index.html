        <div class="entry-content">
          <p>这一季读完六本。按「值得重读」「读完就够」「不该开始」分三档，每本一句实话，不给评分。</p>
          <p>值得重读的两本，共同点是都不急着给结论，愿意把过程摊开给你看。读完就够的三本，观点没错，但把一个下午能说清的事写成了一本书。</p>
          <p>不该开始的那本，我读到一半才明白它其实是一篇长文加了很多页留白。以后遇到同样版式的书，先翻目录再决定。</p>
          <p>下一季想换个读法：同一主题连着读三本，让它们互相拆台。</p>
