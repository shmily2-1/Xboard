# Independent instance ONLY. Never include this in Baota's main nginx.conf.
worker_processes 1;
pid logs/nginx.pid;
error_log logs/error.log warn;
worker_shutdown_timeout 10s;

events { worker_connections 1024; }

http {
    default_type application/json;
    charset utf-8;
    server_tokens off;
    sendfile on;
    keepalive_timeout 30;
    client_header_timeout 15s;
    client_body_timeout 30s;
    send_timeout 30s;
    client_max_body_size 10m;

    client_body_temp_path temp/client_body;
    proxy_temp_path temp/proxy;
    fastcgi_temp_path temp/fastcgi;
    uwsgi_temp_path temp/uwsgi;
    scgi_temp_path temp/scgi;

    # No query strings, Authorization, cookies, request bodies or tokens in access logs.
    log_format api_safe '$remote_addr [$time_local] "$request_method $uri" '
                        '$status $body_bytes_sent $request_time';
    access_log logs/access.log api_safe;

    server {
        # Local FRPC only; deliberately no wildcard/IPv6 public listener.
        listen 127.0.0.1:8380;
        server_name localhost 127.0.0.1 dorocloud.net;
        root D:/wwwroot/dorocloud.net/windows/api-8380/captcha;
        absolute_redirect off;

        # The client WebView can keep using https://user-api.hizui.cn without a path.
        # This page contains no admin/theme content; it only provides the same-origin Cap assets.
        location = / {
            default_type text/html;
            add_header Cache-Control "no-store" always;
            try_files /captcha.html =404;
        }

        location = /captcha.html {
            default_type text/html;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
            try_files $uri =404;
        }

        # Health endpoint used by the independent 8380 supervisor.
        location = /health {
            default_type application/json;
            add_header Cache-Control "no-store" always;
            return 200 '{"service":"DoroCloud API 8380","api_base":"/api/v1","theme_enabled":false,"instance":"api-8380","cap_web":true}';
        }

        # Same-origin Cap static resources. Keep this list explicit; do not expose the project public root.
        location = /assets/cap/widget.js {
            default_type application/javascript;
            add_header Cache-Control "public, max-age=3600" always;
            add_header X-Content-Type-Options "nosniff" always;
            try_files /assets/cap/widget.js =404;
        }
        location = /assets/cap/cap_wasm_bg.wasm {
            default_type application/wasm;
            add_header Cache-Control "public, max-age=3600" always;
            add_header X-Content-Type-Options "nosniff" always;
            try_files /assets/cap/cap_wasm_bg.wasm =404;
        }
        location = /assets/cap/hashwx.wasm {
            default_type application/wasm;
            add_header Cache-Control "public, max-age=3600" always;
            add_header X-Content-Type-Options "nosniff" always;
            try_files /assets/cap/hashwx.wasm =404;
        }
        location = /assets/cap/pako_inflate.min.js {
            default_type application/javascript;
            add_header Cache-Control "public, max-age=3600" always;
            add_header X-Content-Type-Options "nosniff" always;
            try_files /assets/cap/pako_inflate.min.js =404;
        }

        # Public/user/client APIs only. Node/server/admin APIs are not exposed here.
        # Direct FastCGI reuses PHP; no dependency on the 8080 listener or a new PHP pool.
        location ~ ^/api/v[12]/(?:guest|passport|user|client)(?:/|$) {
            include fastcgi-api.params;
            fastcgi_param SCRIPT_FILENAME D:/wwwroot/dorocloud.net/public/index.php;
            fastcgi_param HTTP_ACCEPT application/json;
            fastcgi_param HTTP_AUTHORIZATION $http_authorization;
            fastcgi_param HTTP_PROXY "";
            fastcgi_pass 127.0.0.1:20085;
            fastcgi_connect_timeout 3s;
            fastcgi_send_timeout 60s;
            fastcgi_read_timeout 60s;
            fastcgi_intercept_errors off;
            fastcgi_hide_header X-Powered-By;
            add_header Cache-Control "no-store" always;
        }

        # No index.php, theme, assets outside the Cap allowlist, WP REST, short subscription or backend HTML.
        location / {
            add_header Cache-Control "no-store" always;
            return 404 '{"message":"API only. Use the original Xboard /api/v1 or /api/v2 frontend routes."}';
        }
    }
}
