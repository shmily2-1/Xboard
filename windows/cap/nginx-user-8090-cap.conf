# PENDING ACTIVATION: include this inside the existing 8090 server block.
# Do not reload/restart nginx until the site owner approves.
location ^~ /wp-json/wp/v2/captcha/ {
    client_max_body_size 64k;
    if ($request_method != POST) { return 405; }
    if ($uri !~ "^/wp-json/wp/v2/captcha/(challenge|redeem)$") { return 404; }
    rewrite ^/wp-json/wp/v2/captcha/(challenge|redeem)$ /api/v1/guest/captcha/$1 break;
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $xboardblog_forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_connect_timeout 2s;
    proxy_read_timeout 10s;
    proxy_buffering off;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}
